apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pixel3mesh-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/pixel3mesh/pixel3mesh-api:api-only
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SUPABASE_URL
              value: https://PROJECT_REF.supabase.co
            - name: CORS_ORIGINS
              value: https://3d-product-reconstructor.pages.dev
            - name: ENVIRONMENT
              value: production
            - name: RECONSTRUCTION_ENGINE
              value: disabled
            - name: PORT
              value: "8080"
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true
