<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#142019" />
    <script>
      // Set the saved studio before CSS and React paint. Storage may be blocked.
      (() => {
        let theme;
        try { theme = localStorage.getItem('reconstruct.theme'); } catch {}
        if (theme !== 'forest' && theme !== 'ivory') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'forest' : 'ivory';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme === 'ivory' ? 'light' : 'dark';
        document.querySelector('meta[name="theme-color"]').content = theme === 'ivory' ? '#eeeade' : '#142019';
      })();
    </script>
    <meta name="description" content="Explore how a single image becomes a three-dimensional mesh. An interactive introduction to Pixel2Mesh reconstruction." />
    <title>Reconstruct — From image to form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This interactive demonstration needs JavaScript. The project explores 3D object reconstruction from a single RGB image using Pixel2Mesh.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
